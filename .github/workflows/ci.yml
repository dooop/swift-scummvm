name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin to the macos-15 runner's *default* Xcode: non-default Xcode installs on
  # this image have been observed missing iOS/tvOS platform support, which
  # breaks "generic/platform=iOS|tvOS" destination resolution.
  XCODE_VERSION: "16.4"

jobs:
  changes:
    name: Detect engine changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether a source build is needed
        id: filter
        run: |
          # Wrapper-only changes are covered by the binary-mode job; the ~7,700-TU
          # source build only has to run when engine-facing inputs move.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(Package\.swift|Sources/ScummVMEngine$|Sources/ScummVMEngineOverrides/|Sources/ScummVMiOS/|Sources/ScummVMmacOS/|Scripts/|\.gitmodules)'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi

  build-source:
    name: Source build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            key: macos
            destination: ""
          - name: iOS
            key: ios
            destination: "generic/platform=iOS"
          - name: tvOS
            key: tvos
            destination: "generic/platform=tvOS"
    env:
      # Compile the engine from the submodule instead of consuming the release build:
      # this job exists precisely to validate engine, override and glue changes.
      SCUMMVM_BUILD_FROM_SOURCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Record submodule commit
        run: git -C Sources/ScummVMEngine rev-parse HEAD > .scummvmengine-sha

      - name: Cache SwiftPM build artifacts
        uses: actions/cache@v6
        with:
          path: .build
          # Resources are excluded from the hash: they only move with the submodule,
          # which .scummvmengine-sha already covers, and hashing 86 MB is slow.
          key: spm-${{ matrix.key }}-v3-${{ hashFiles('Package.swift', 'Package.resolved', '.scummvmengine-sha', 'Sources/**', '!Sources/ScummVMEngine/**', '!Sources/ScummVMResources*/**', 'Tests/**') }}

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Build (macOS)
        if: matrix.key == 'macos'
        run: swift build

      - name: Build ScummVM
        if: matrix.key != 'macos'
        run: |
          xcodebuild build \
            -scheme ScummVM \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath .build/derivedData \
            ARCHS=arm64 EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

  build-binary:
    name: Binary build (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: "generic/platform=macOS"
          - name: iOS
            destination: "generic/platform=iOS"
          - name: tvOS
            destination: "generic/platform=tvOS"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No submodule: this job exercises exactly what a consumer gets.
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Check that an engine release is referenced
        id: guard
        run: |
          if grep -q 'engineChecksumiOS = "0\{64\}"' Package.swift; then
            echo "::notice::Package.swift still carries placeholder engine checksums - run the release-engine workflow and bump them. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ScummVM against the prebuilt engine
        if: steps.guard.outputs.ready == 'true'
        run: |
          xcodebuild build \
            -scheme ScummVM \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath .build/derivedData \
            ARCHS=arm64 EXCLUDED_ARCHS=x86_64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Run tests against the prebuilt engine (macOS)
        if: steps.guard.outputs.ready == 'true' && matrix.name == 'macOS'
        run: swift test

      - name: Link and smoke-test ScummVMApp
        if: steps.guard.outputs.ready == 'true' && matrix.name == 'macOS'
        run: |
          swift build --product ScummVMApp -c release
          BIN_PATH="$(swift build --product ScummVMApp -c release --show-bin-path)"

          FRAMEWORK="$(find "$BIN_PATH" -maxdepth 2 -name 'ScummVMmacOS.framework' -print -quit)"
          if [ -z "$FRAMEWORK" ]; then
            echo "::error::ScummVMmacOS.framework was not placed next to the executable"
            exit 1
          fi

          # The payload rides inside the framework in binary mode. If it is missing the
          # app builds and launches, then fails to find any theme or engine data.
          for file in engine-data/engine_data_core.mk scummmodern.zip translations.dat pred.dic; do
            if [ ! -e "$FRAMEWORK/Resources/$file" ]; then
              echo "::error::missing runtime resource: $file"
              exit 1
            fi
          done

          # Engines are only reachable through the detection table, which nothing
          # outside the dylib references - a regression in the pipeline's force_load
          # would silently produce a framework that finds zero games.
          nm -gU "$FRAMEWORK/ScummVMmacOS" > framework-symbols.txt
          for symbol in ScummEngine SciEngine AGSEngine; do
            if ! grep -q "$symbol" framework-symbols.txt; then
              echo "::error::engine symbol '$symbol' missing from the prebuilt framework"
              exit 1
            fi
          done
          echo "framework, payload and engine symbols OK"

  build-android:
    name: Build (Android AAR)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Upstream's configure greps this out of dists/android/build.gradle and
      # aborts on any mismatch, so it has to be the exact revision.
      NDK_VERSION: "23.2.8568313"
      # A representative slice of engines: enough to exercise configure, the
      # NDK toolchain, JNI wiring and packaging without a two-hour full build.
      # Drop scummvm.configureArgs to build every stable engine.
      SCUMMVM_ABIS: "arm64-v8a"
      SCUMMVM_CONFIGURE_ARGS: "--disable-all-engines --enable-engine=scumm,sky,sword1,agi"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          # The runner image pre-sets ANDROID_NDK_ROOT/HOME to its bundled
          # default NDK, which build.gradle.kts's resolveNdkDir() prefers over
          # the SDK-relative path -- repoint them at the pinned version we
          # just installed so the wrong NDK doesn't win.
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Record submodule commit
        run: git -C Sources/ScummVMEngine rev-parse HEAD > .scummvmengine-sha

      - name: Cache native engine build
        uses: actions/cache@v4
        with:
          path: android/scummvm/build/native
          key: android-native-v1-${{ env.SCUMMVM_ABIS }}-${{ hashFiles('.scummvmengine-sha') }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      # The build resolves the NDK from $ANDROID_HOME/ndk/<version>, with the
      # version read out of the submodule's dists/android/build.gradle.
      - name: Build AAR
        working-directory: android
        run: |
          ./gradlew --no-daemon :scummvm:assembleRelease \
            -Pscummvm.abis="${SCUMMVM_ABIS}" \
            -Pscummvm.configureArgs="${SCUMMVM_CONFIGURE_ARGS}"

      - name: Build release test app from the AAR
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -Pscummvm.releaseAar="${GITHUB_WORKSPACE}/android/scummvm/build/outputs/aar/scummvm-release.aar"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-android-aar
          path: android/scummvm/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-android-test-app
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
