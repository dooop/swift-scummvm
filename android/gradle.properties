org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# ScummVM native build
# ---------------------------------------------------------------------------
# ABIs to build libscummvm.so for. Comma separated subset of:
#   armeabi-v7a, arm64-v8a, x86, x86_64
# armeabi-v7a and x86 additionally need the NDK cpufeatures sources.
scummvm.abis=arm64-v8a,x86_64

# Extra flags appended to the upstream ./configure invocation, e.g.
#   scummvm.configureArgs=--disable-all-engines --enable-engine=scumm,sky
# Leave empty to use the upstream defaults (every stable engine).
scummvm.configureArgs=

# Parallelism for `make`. Empty means "number of available processors".
scummvm.buildJobs=

# Point this at a directory laid out as <dir>/<abi>/libscummvm.so to skip the
# native build entirely and package pre-built libraries instead.
# scummvm.prebuiltLibsDir=

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
